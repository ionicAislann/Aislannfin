<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12041f"><title>FinVoice AI</title>
<style>
:root{--bg:#f3eefb;--bg2:#fff;--cd:#fff;--tx:#1b1030;--mut:#6b5f82;--bd:#e3d9f3;--a:#8B5CF6;--a2:#c026d3;--g:#16a34a;--o:#e8750f;--r:#e11d48}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12041f;--bg2:#12041f;--cd:#ffffff12;--tx:#f5f1ff;--mut:#b6a6d6;--bd:#ffffff1f;--g:#34d399;--o:#FF8A24;--r:#fb7185}}
:root[data-theme=dark]{--bg:#12041f;--bg2:#12041f;--cd:#ffffff12;--tx:#f5f1ff;--mut:#b6a6d6;--bd:#ffffff1f;--g:#34d399;--o:#FF8A24;--r:#fb7185}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--tx);font:16px system-ui,sans-serif;background:radial-gradient(120% 60% at 50% 0,#5b1fa066,transparent 70%),var(--bg);background-attachment:fixed}
main{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 120px}
h1{font-size:22px;margin:0 0 12px}h2{font-size:16px;margin:18px 0 8px}small{color:var(--mut);display:block}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:22px;padding:14px 16px;margin-bottom:10px;backdrop-filter:blur(8px)}
.f{display:flex;justify-content:space-between;align-items:center;gap:8px}.b{font-weight:600;white-space:nowrap}.g{color:var(--g)}.o{color:var(--o)}.r{color:var(--r)}
input,select,button{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px;width:100%;margin-bottom:8px}
button{cursor:pointer}.pr{background:linear-gradient(135deg,var(--a2),var(--a));color:#fff;border:0;font-weight:600}.sm{width:auto;padding:6px 10px;margin:0 0 0 6px;font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.bal{text-align:center;margin:8px 0 18px}.bal b{display:block;font-size:44px;letter-spacing:-1px}
.acts{display:flex;justify-content:center;gap:28px;margin-bottom:20px}.acts button{width:auto;border:0;background:none;margin:0;padding:0;font-size:14px}
.acts i{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--cd);border:1px solid var(--bd);margin:0 auto 6px}
svg{width:24px;height:24px;fill:currentColor}
nav{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:528px;margin:auto;display:flex;justify-content:space-around;align-items:center;background:#1d0b33;border:1px solid #ffffff22;border-radius:32px;padding:8px}
nav button{width:44px;height:44px;border:0;border-radius:50%;margin:0;padding:0;background:none;color:#cbbbe8;display:grid;place-items:center}nav button.on{background:#fff;color:#12041f}
nav .ai{width:58px;height:58px;background:linear-gradient(135deg,var(--a2),var(--a));color:#fff;box-shadow:0 0 22px #a855f799}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a2),var(--a))}
.em{color:var(--mut);text-align:center;padding:12px}.t{position:fixed;left:16px;right:16px;bottom:100px;background:var(--tx);color:var(--bg);padding:12px;border-radius:12px;text-align:center;z-index:9}
.ow{position:relative;width:150px;height:150px;margin:6px auto 12px}.ow svg{position:absolute;inset:0;margin:auto;width:46px;height:46px;color:#fff}
.orb{width:150px;height:150px;border-radius:50%;background:conic-gradient(#7c3aed,#c026d3,#3b82f6,#7c3aed);box-shadow:0 0 60px #a855f7aa;animation:sp 8s linear infinite,mo 4s ease-in-out infinite alternate;-webkit-mask:radial-gradient(circle,transparent 38%,#000 40%);mask:radial-gradient(circle,transparent 38%,#000 40%)}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes mo{from{border-radius:50% 50% 50% 50%/60% 40% 60% 40%}to{border-radius:40% 60% 55% 45%/45% 55% 45% 55%}}
.ch{display:flex;flex-direction:column;gap:10px;padding-bottom:70px}.m{max-width:85%;padding:10px 14px;border-radius:18px;background:var(--cd);border:1px solid var(--bd);white-space:pre-line}
.m.u{align-self:flex-end;background:linear-gradient(135deg,var(--a2),var(--a));color:#fff;border:0}
.ib{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:528px;margin:auto;display:flex;gap:8px;align-items:center;background:#1d0b33;border:1px solid #ffffff22;border-radius:30px;padding:8px}
.ib input{margin:0;border:0;background:none;color:#fff;flex:1}.ib button{width:44px;height:44px;margin:0;border-radius:50%;padding:0;display:grid;place-items:center;border:0;color:#fff;background:#ffffff1a}
.ib .lis{background:#e11d48;animation:pl 1s infinite}@keyframes pl{50%{opacity:.55}}.ib .pr{background:linear-gradient(135deg,var(--a2),var(--a))}
</style></head><body><main id="app"></main><nav id="nav"></nav><div id="toast" class="t" hidden></div>
<script>
const $=s=>document.querySelector(s);
const IC={home:'M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z',list:'M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z',bot:'M20 9V7c0-1.1-.9-2-2-2h-3c0-1.66-1.34-3-3-3S9 3.34 9 5H6c-1.1 0-2 .9-2 2v2c-1.66 0-3 1.34-3 3s1.34 3 3 3v4c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-4c1.66 0 3-1.34 3-3s-1.34-3-3-3zM7.5 11.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5S9.83 13 9 13s-1.5-.67-1.5-1.5zM16 17H8v-2h8v2zm-1-4c-.83 0-1.5-.67-1.5-1.5S14.17 10 15 10s1.5.67 1.5 1.5S15.83 13 15 13z',chart:'M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z',user:'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z',mic:'M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z',send:'M2 21l21-9L2 3v7l15 2-15 2z',up:'M7 17l9.2-9.2M17 17V7H7',x:'M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z'};
const ic=k=>`<svg viewBox="0 0 24 24"><path d="${IC[k]}"/></svg>`;
const def=()=>({tx:[],plans:[],theme:'system'});
let S;try{S=JSON.parse(localStorage.getItem('fv')||'')||def()}catch(e){S=def()}
S.bills=S.bills||[];
let V='home',M=new Date().toLocaleDateString('sv').slice(0,7),Q='',PT='D',CH=[],PD=null;
const save=()=>{try{localStorage.setItem('fv',JSON.stringify(S))}catch(e){toast('Não foi possível salvar neste navegador.')}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,2600)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>new Date().toLocaleDateString('sv');
const brl=c=>{const a=Math.abs(c),i=String(Math.floor(a/100)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');return(c<0?'-':'')+'R$ '+i+','+String(a%100).padStart(2,'0')};
const parse=t=>{let s=String(t).replace(/R\$|\s/g,'');if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const n=Number(s);return isFinite(n)&&n>0?Math.round(n*100):null};
const dbr=d=>d?d.split('-').reverse().join('/'):'';
const addM=(iso,k)=>{const[y,m,d]=iso.split('-').map(Number),dt=new Date(y,m-1+k,1),l=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();dt.setDate(Math.min(d,l));return dt.toLocaleDateString('sv')};
const live=()=>S.tx.filter(t=>!t.archived);
const sum=(l,ty,st)=>l.filter(t=>t.type===ty&&t.status===st).reduce((a,t)=>a+t.cents,0);
const CATS=['Salário','Alimentação','Moradia','Transporte','Saúde','Lazer','Educação','Assinaturas','Contas fixas','Outros'];
const go=(v,p)=>{V=v;if(p)PT=p;render();scrollTo(0,0)};
function ensureBills(){let ch=0;const td=today();
 for(const b of S.bills){if(!b.active)continue;for(const k of[0,1]){const mo=addM(td,k).slice(0,7);if(mo<b.start)continue;
  if(S.tx.some(t=>t.billId===b.id&&t.date.startsWith(mo)))continue;
  const[y,m]=mo.split('-').map(Number),d=Math.min(b.day,new Date(y,m,0).getDate()),dt=mo+'-'+String(d).padStart(2,'0');
  S.tx.push({id:id(),desc:b.desc,cents:b.cents,type:'D',cat:b.cat,date:dt,due:dt,status:(b.paidFirst&&mo===b.start)?'paid':'planned',source:'conta fixa',billId:b.id,archived:false});ch=1}}
 if(ch)save()}
function bl(){const l=S.bills.filter(b=>b.active);return l.length?l.map(b=>`<div class="cd f"><span>${esc(b.desc)}<small>${esc(b.cat)} · todo dia ${b.day}</small></span><span style="white-space:nowrap"><span class="b">${brl(b.cents)}</span><button class="sm" onclick="endBill('${b.id}')">Encerrar</button></span></div>`).join(''):'<div class="em">Nenhuma conta fixa. Diga “assinei Netflix por 41 reais” ao assistente.</div>'}
function endBill(i){const b=S.bills.find(x=>x.id===i),td=today(),f=S.tx.filter(t=>t.billId===i&&t.status==='planned'&&!t.archived&&t.date>td);
 if(!confirm(`Encerrar "${b.desc}" (${brl(b.cents)})?\n${f.length} lançamento(s) futuro(s) previsto(s) serão arquivados. O histórico pago permanece.`))return;
 b.active=false;f.forEach(t=>t.archived=true);save();render()}
function render(){ensureBills();
 document.documentElement.dataset.theme=S.theme==='system'?'':S.theme;
 $('#nav').style.display=V==='ai'?'none':'flex';
 $('#nav').innerHTML=[['home','home'],['tx','list'],['ai','bot'],['plans','chart'],['cfg','user']].map(([k,i])=>`<button class="${V===k?'on':''} ${k==='ai'?'ai':''}" aria-label="${k}" onclick="go('${k}')">${ic(i)}</button>`).join('');
 $('#app').innerHTML={home,tx,plans,cfg,ai}[V]();
 if(V==='ai')setTimeout(()=>{scrollTo(0,document.body.scrollHeight)},0);
}
function home(){
 const all=live(),bal=sum(all,'R','paid')-sum(all,'D','paid'),l=all.filter(t=>t.date.startsWith(M)),td=today(),pm=addM(M+'-01',-1).slice(0,7);
 const cat=(m)=>{const o={};all.filter(t=>t.type==='D'&&t.status==='paid'&&t.date.startsWith(m)).forEach(t=>o[t.cat]=(o[t.cat]||0)+t.cents);return o};
 const cur=cat(M),prv=cat(pm),top=Object.entries(cur).sort((a,b)=>b[1]-a[1]).slice(0,4),tc=Object.values(cur).reduce((a,b)=>a+b,0),tp=Object.values(prv).reduce((a,b)=>a+b,0);
 const ch=(a,b)=>b?`<small class="${a>b?'r':'g'}">${a>b?'▲':'▼'} ${Math.abs(Math.round((a-b)/b*100))}% ${a>b?'a mais':'a menos'}</small>`:'<small>sem base no mês anterior</small>';
 const up=all.filter(t=>t.type==='D'&&t.status==='planned'&&(t.due||t.date)>=td).sort((a,b)=>(a.due||a.date).localeCompare(b.due||b.date)).slice(0,4);
 return`<small>Bem-vindo de volta</small><div class="bal"><small>Seu saldo</small><b>${brl(bal)}</b></div>
 <div class="acts"><button onclick="go('tx','D')"><i>${ic('up')}</i>Despesa</button><button onclick="go('tx','R')"><i style="transform:rotate(180deg)">${ic('up')}</i>Receita</button><button onclick="go('plans')"><i>${ic('chart')}</i>Parcelar</button></div>
 <div class="cd"><div class="f"><b>Gastos do mês</b><span class="b">${brl(tc)}</span></div>${top.length?top.map(([c,v])=>`<div class="f" style="margin-top:12px"><span>${esc(c)}${ch(v,prv[c]||0)}</span><span class="b">${brl(v)}</span></div>`).join(''):'<div class="em">Sem despesas realizadas neste mês.</div>'}</div>
 <div class="cd"><div class="f"><span>Receitas<small>mês</small></span><span class="b g">${brl(sum(l,'R','paid'))}</span></div><div class="f" style="margin-top:10px"><span>Previstas<small>despesas</small></span><span class="b o">${brl(sum(l,'D','planned'))}</span></div></div>
 <div class="cd f" style="gap:12px"><span>${tc||tp?(tc>tp&&tp?`Você gastou ${Math.round((tc-tp)/tp*100)}% a mais que no mês passado.`:tp?`Você gastou ${Math.round((tp-tc)/tp*100)}% a menos que no mês passado.`:'Primeiro mês com gastos registrados.'):'Registre despesas para ver comparações.'}</span><button class="pr sm" style="white-space:nowrap" onclick="go('ai')">Perguntar</button></div>
 <h2>Próximos vencimentos</h2>${up.length?up.map(t=>`<div class="cd f"><span>${esc(t.desc)}<small>${dbr(t.due||t.date)}</small></span><span class="b o">${brl(t.cents)}</span></div>`).join(''):'<div class="em">Nenhum vencimento próximo.</div>'}`}
function pcard(p){const it=live().filter(t=>t.planId===p.id),pd=it.filter(t=>t.status==='paid'),pc=pd.reduce((a,t)=>a+t.cents,0),tot=it.reduce((a,t)=>a+t.cents,0);
 return`<div class="cd"><div class="f"><span>${esc(p.desc)}<small>${pd.length}/${it.length} pagas · falta ${brl(tot-pc)}</small></span><span class="b">${brl(tot)}</span></div><div class="bar"><i style="width:${tot?pc/tot*100:0}%"></i></div></div>`}
function tx(){
 const l=live().filter(t=>t.date.startsWith(M)&&t.desc.toLowerCase().includes(Q.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));
 return`<h1>Lançamentos</h1><div class="cd">
 <select id="ty"><option value="D" ${PT==='D'?'selected':''}>Despesa</option><option value="R" ${PT==='R'?'selected':''}>Receita</option></select>
 <input id="ds" placeholder="Descrição"><div class="row"><input id="vl" inputmode="decimal" placeholder="Valor (ex.: 80,00)"><select id="ct">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
 <div class="row"><label>Data<input id="dt" type="date" value="${today()}"></label><label>Vencimento<input id="du" type="date"></label></div>
 <select id="st"><option value="paid">Realizado (pago/recebido)</option><option value="planned">Previsto</option></select>
 <button class="pr" onclick="addTx()">Salvar</button></div>
 <h2>Histórico</h2><div class="row"><input type="month" value="${M}" onchange="M=this.value||M;render()"><input placeholder="Buscar" value="${esc(Q)}" onchange="Q=this.value;render()"></div>
 ${l.length?l.map(t=>`<div class="cd f"><span>${esc(t.desc)}<small>${dbr(t.date)} · ${esc(t.cat)} · ${t.status==='paid'?'realizado':'previsto'}</small></span><span style="white-space:nowrap"><span class="b ${t.type==='R'?'g':''}">${t.type==='R'?'+':'-'}${brl(t.cents)}</span>
 <button class="sm" onclick="tog('${t.id}')">${t.status==='paid'?'Desfazer':'Pagar'}</button><button class="sm" onclick="del('${t.id}')">✕</button></span></div>`).join(''):'<div class="em">Nada neste período.</div>'}`}
function addTx(){
 const ds=$('#ds').value.trim(),c=parse($('#vl').value),dt=$('#dt').value;
 if(!ds||!c||!dt)return toast('Informe descrição, valor e data válidos.');
 S.tx.push({id:id(),desc:ds,cents:c,type:$('#ty').value,cat:$('#ct').value,date:dt,due:$('#du').value||null,status:$('#st').value,source:'manual',archived:false});
 save();M=dt.slice(0,7);render();toast('Lançamento salvo.')}
function tog(i){const t=S.tx.find(x=>x.id===i);t.status=t.status==='paid'?'planned':'paid';save();render()}
function del(i){const t=S.tx.find(x=>x.id===i);if(!confirm(`Arquivar "${t.desc}" (${brl(t.cents)})?\nEle sai dos totais, mas continua no backup.`))return;t.archived=true;save();render()}
function plans(){const l=S.plans.filter(p=>!p.archived);
 return`<h1>Compras parceladas</h1><div class="cd"><input id="pd" placeholder="Descrição da compra"><div class="row"><input id="pt" inputmode="decimal" placeholder="Valor total"><input id="pn" type="number" min="2" max="60" placeholder="Parcelas"></div>
 <label>Primeiro vencimento<input id="pf" type="date" value="${today()}"></label><button class="pr" onclick="addPlan()">Criar parcelamento</button></div>
 <h2>Em acompanhamento</h2>${l.length?l.map(p=>pcard(p)+`<button class="sm" style="margin:-4px 0 10px" onclick="delPlan('${p.id}')">Excluir parcelamento</button>`).join(''):'<div class="em">Nenhuma compra parcelada.</div>'}<h2>Contas fixas e assinaturas</h2>${bl()}`}
function addPlan(){
 const d=$('#pd').value.trim(),T=parse($('#pt').value),n=parseInt($('#pn').value),f=$('#pf').value;
 if(!d||!T||!(n>=2&&n<=60)||!f)return toast('Informe descrição, valor, parcelas (2–60) e data.');
 const p={id:id(),desc:d,total:T,n,first:f,archived:false},base=Math.floor(T/n),rest=T-base*n;S.plans.push(p);
 for(let k=0;k<n;k++)S.tx.push({id:id(),desc:`${d} (${k+1}/${n})`,cents:base+(k===0?rest:0),type:'D',cat:'Outros',date:addM(f,k),due:addM(f,k),status:'planned',source:'manual',planId:p.id,archived:false});
 save();render();toast('Parcelamento criado.')}
function delPlan(i){const p=S.plans.find(x=>x.id===i),it=live().filter(t=>t.planId===i),pd=it.filter(t=>t.status==='paid').length;
 if(!confirm(`Arquivar "${p.desc}"?\nIsso afeta ${it.length} parcelas (${pd} já pagas). Elas saem dos totais, mas ficam no backup.`))return;
 p.archived=true;it.forEach(t=>t.archived=true);save();render()}
function cfg(){return`<h1>Configurações</h1><h2>Tema</h2><select onchange="S.theme=this.value;save();render()">${[['system','Automático'],['light','Claro'],['dark','Escuro']].map(([v,n])=>`<option value="${v}" ${S.theme===v?'selected':''}>${n}</option>`).join('')}</select>
 <h2>Backup local</h2><button onclick="exp()">Exportar dados (.json)</button><label>Importar backup<input type="file" accept=".json" onchange="imp(this)"></label>
 <div class="em">Dados financeiros só neste navegador. O reconhecimento de voz usa o serviço do navegador (no Chrome, o áudio é processado pelo Google). Limpar os dados do navegador apaga tudo: faça backup.</div>`}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='finvoice-backup-'+today()+'.json';a.click()}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{
 const d=JSON.parse(r.result);if(!Array.isArray(d.tx)||!Array.isArray(d.plans))throw 0;
 if(!d.tx.every(t=>t&&t.id&&t.desc&&Number.isInteger(t.cents)&&['R','D'].includes(t.type)&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&['paid','planned'].includes(t.status)))throw 0;
 const ids=new Set(S.tx.map(t=>t.id)),pids=new Set(S.plans.map(p=>p.id)),nt=d.tx.filter(t=>!ids.has(t.id)),np=d.plans.filter(p=>!pids.has(p.id));
 S.tx.push(...nt);S.plans.push(...np);save();render();toast(`Importados: ${nt.length} lançamentos (existentes mantidos).`)}catch(e){toast('Arquivo de backup inválido.')}};r.readAsText(f)}
/* ---- Assistente (interpretador local, sem internet) ---- */
function ai(){return`<div class="f" style="justify-content:space-between"><b>FinVoice AI</b><button class="sm" aria-label="fechar" onclick="go('home')" style="margin:0">${ic('x')}</button></div>
 <h1 style="margin-top:14px;text-align:center">Pergunte sobre suas finanças</h1><div class="ow"><div class="orb"></div>${ic('bot')}</div><div class="em" id="st">${ST}</div>
 <div class="ch">${CH.map(m=>`<div class="m ${m.r}">${esc(m.t)}${m.ok?`<div class="row" style="margin-top:8px"><button class="pr" onclick="conf(1)">Salvar</button><button onclick="conf(0)">Cancelar</button></div>`:''}</div>`).join('')||'<div class="em">Digite, por exemplo: “assinei Netflix por 41 reais” ou “quanto gastei este mês”.</div>'}</div>
 <div class="ib"><button aria-label="voz" class="${LIS?'lis':''}" onclick="mic()">${ic('mic')}</button><input id="q" placeholder="Pergunte algo..." onkeydown="if(event.key==='Enter')send()"><button class="pr" aria-label="enviar" onclick="send()">${ic('send')}</button></div>`}
const GUESS=[[/assin|streaming|netflix|spotify|disney|youtube|prime|globoplay|deezer|hbo|max\b/,'Assinaturas'],[/aluguel|condom[ií]nio|luz|energia|[áa]gua|internet|telefone|celular|iptu|g[aá]s\b/,'Contas fixas'],[/combust|gasolina|uber|[ôo]nibus|transporte|t[aá]xi/,'Transporte'],[/mercado|aliment|restaurante|lanche|comida|padaria|ifood/,'Alimentação'],[/farm[aá]cia|m[eé]dic|sa[uú]de|consulta/,'Saúde'],[/cinema|lazer|viagem|jogo/,'Lazer'],[/escola|curso|faculdade|educa|mensalidade/,'Educação'],[/sal[aá]rio/,'Salário']];
const SERV=[['netflix','Netflix'],['spotify','Spotify'],['disney','Disney+'],['hbo','HBO Max'],['prime video','Prime Video'],['amazon prime','Amazon Prime'],['youtube premium','YouTube Premium'],['globoplay','Globoplay'],['deezer','Deezer'],['apple tv','Apple TV+'],['paramount','Paramount+'],['crunchyroll','Crunchyroll'],['icloud','iCloud'],['google one','Google One'],['chatgpt','ChatGPT'],['claude','Claude']];
const STOP=/\b(reais|real|r\$|com|de|da|do|em|no|na|para|por|o|a|um|uma|meu|minha|valor|conta|servi[cç]o|registre|registrar|despesa|gastei|paguei|comprei|assinei|assinatura|cadastre|cadastrar|crie|criar|mensal|todo|m[eê]s|dia|hoje|receb\w*|ganhei|receita|sal[aá]rio|streamer|streaming)\b/g;
const clean=s=>s.replace(STOP,' ').replace(/[^\p{L}\s]/gu,' ').replace(/\s+/g,' ').trim();
const guess=t=>(GUESS.find(([r])=>r.test(t))||[0,'Outros'])[1];
let LIS=null,ST='';
const setST=s=>{ST=s;const e=$('#st');if(e)e.textContent=s;if(s)toast(s)};
function mic(){
 const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!R)return setST('Este navegador/visualizador não suporta voz. Abra no Chrome ou use o microfone do teclado.');
 if(LIS){LIS.stop();return}
 let fin='',err='',got=false;const hint=window.isSecureContext?'':' (página fora de HTTPS: o Chrome costuma bloquear a voz; hospede o arquivo ou use o microfone do teclado)';
 let r;try{r=new R()}catch(e){return setST('Não foi possível iniciar a voz: '+e.message)}
 r.lang='pt-BR';r.interimResults=true;r.continuous=false;LIS=r;ST='Iniciando microfone…';
 r.onstart=()=>setST('');r.onaudiostart=()=>{ST='Ouvindo… fale agora';const e=$('#st');if(e)e.textContent=ST};
 r.onresult=e=>{got=true;let s='';for(const x of e.results)s+=x[0].transcript;fin=s;const q=$('#q');if(q)q.value=s};
 r.onerror=e=>{err=e.error;setST(({'not-allowed':'Microfone bloqueado para esta página','service-not-allowed':'Serviço de voz bloqueado para esta página','no-speech':'Não ouvi nada. Tente de novo.','network':'Sem conexão com o serviço de voz','audio-capture':'Microfone não encontrado','language-not-supported':'Idioma pt-BR não suportado'}[e.error]||'Erro de voz: '+e.error)+(/allowed/.test(e.error)?hint:''))};
 r.onend=()=>{LIS=null;if(fin.trim()&&V==='ai'){ST='';$('#q').value=fin;send()}else{if(!err&&!got)ST='Não captei áudio. Confira a permissão do microfone'+hint+'.';render()}};
 try{r.start()}catch(e){LIS=null;return setST('Não foi possível iniciar: '+e.message+hint)}
 render()}
function send(){const el=$('#q'),t=el.value.trim();if(!t)return;CH.push({r:'u',t});const a=interp(t);CH.push({r:'b',t:a.t,ok:a.ok});render()}
function conf(y){if(!PD)return;const p=PD;PD=null;CH.forEach(m=>m.ok=false);
 if(y&&p.bill){S.bills.push({id:id(),desc:p.desc,cents:p.cents,cat:p.cat,day:p.bill.day,start:today().slice(0,7),paidFirst:p.bill.paidFirst,active:true});ensureBills();save();CH.push({r:'b',t:`Conta fixa salva: ${p.desc}, ${brl(p.cents)} todo dia ${p.bill.day} (${p.cat}). Gerei os lançamentos deste mês e do próximo.`})}
 else if(y){S.tx.push({id:id(),desc:p.desc,cents:p.cents,type:p.type,cat:p.cat,date:today(),due:null,status:'paid',source:'assistente',archived:false});save();CH.push({r:'b',t:`Salvo: ${p.type==='R'?'receita':'despesa'} de ${brl(p.cents)} — ${p.desc}.`})}else CH.push({r:'b',t:'Cancelado. Nada foi salvo.'});render()}
function interp(raw){
 const t=raw.toLowerCase(),l=live(),m=l.filter(x=>x.date.startsWith(M));
 if(PD){if(/^(sim|pode|salvar|confirmo|ok)\b/.test(t)){conf(1);return{t:'Ok.'}}if(/^(n[aã]o|cancel)/.test(t)){conf(0);return{t:'Ok.'}}}
 if(/quanto.*(gast|despes)/.test(t))return{t:`Neste mês: despesas realizadas ${brl(sum(m,'D','paid'))} e previstas ${brl(sum(m,'D','planned'))}.`};
 if(/venc/.test(t)){const td=today(),u=l.filter(x=>x.type==='D'&&x.status==='planned'&&(x.due||x.date)>=td).sort((a,b)=>(a.due||a.date).localeCompare(b.due||b.date)).slice(0,5);return{t:u.length?u.map(x=>`${dbr(x.due||x.date)} — ${x.desc}: ${brl(x.cents)}`).join('\n'):'Nenhum vencimento próximo.'}}
 if(/saldo|dispon/.test(t))return{t:`Saldo (receitas realizadas − despesas realizadas): ${brl(sum(l,'R','paid')-sum(l,'D','paid'))}.`};
 const t2=t.replace(/dia\s+\d{1,2}/g,' '),n=t2.match(/\d[\d.]*(?:,\d{1,2})?/),c=n?parse(n[0]):null,sv=SERV.find(s=>t.includes(s[0])),dm=t.match(/dia\s+(\d{1,2})/),day=dm&&+dm[1]>=1&&+dm[1]<=31?+dm[1]:null;
 const inc=/receb|receita|ganhei|sal[aá]rio/.test(t)&&!/assin/.test(t),exp=!!sv||/despesa|gast|paguei|compr|registr|assin|mensalidade|conta|cadastr|crie|criar/.test(t);
 if(c&&(inc||exp)){
  const type=inc&&!/despesa/.test(t)?'R':'D',cat=sv?'Assinaturas':guess(t),i=t2.indexOf(n[0]);
  let d=sv?sv[1]:(clean(t2.slice(i+n[0].length))||clean(t2.slice(0,i))||cat);d=d[0].toUpperCase()+d.slice(1);
  const rec=type==='D'&&(!!sv||cat==='Assinaturas'||cat==='Contas fixas'||/todo\s+(m[eê]s|dia)|mensal|assin/.test(t)),bill=rec?{day:day||new Date().getDate(),paidFirst:!day}:null;
  PD={type,cents:c,desc:d,cat,bill};
  return{t:`Registrar ${type==='R'?'receita':'despesa'} de ${brl(c)} — ${d} (${cat})${bill?`, conta fixa mensal todo dia ${bill.day}`:', realizada hoje'}. Posso salvar?`,ok:1}}
 return{t:'Não entendi com segurança, então não fiz nada. Tente: “assinei Netflix por 41 reais”, “Spotify, valor 23 reais”, “conta de internet de 120 todo dia 15”, “despesa de 80 com combustível”, “recebi 3.100 de salário”, “quanto gastei este mês”, “quais contas vencem” ou “saldo”.'}}
render();
</script></body></html>
